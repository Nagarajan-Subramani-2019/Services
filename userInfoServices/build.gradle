plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.oxygenraj'
version = '0.0.1-SNAPSHOT'
description = 'User registration, profile lookup and credential verification backed by USER_INFO_SCHEMA'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral() }
dependencyManagement {
    imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.3' }
}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-web-server'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc17'
    providedRuntime('org.springframework.boot:spring-boot-starter-tomcat-runtime') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-web-server'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform(); maxHeapSize = '512m' }
tasks.named('bootWar') { archiveFileName = 'userInfoServices.war' }
tasks.named('war') { enabled = false }
tasks.matching { it.name in ['jar', 'bootJar'] }.configureEach { enabled = false }

tasks.register('dbZip', Zip) {
    group = 'distribution'
    description = 'SQL only, grouped by schema; not executed by Gradle or Spring Boot.'
    archiveFileName = 'userInfoServices-db.zip'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(layout.projectDirectory.dir('db')) { include '**/*.sql' }
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.FAIL
    doFirst {
        if (!fileTree('db') { include '*.sql' }.isEmpty()) {
            throw new GradleException('SQL must be in db/SCHEMA_NAME/, not directly under db/.')
        }
    }
}
tasks.register('zipDbFolder') { dependsOn tasks.named('dbZip') }
tasks.named('bootWar') { dependsOn tasks.named('dbZip') }
tasks.named('assemble') { dependsOn tasks.named('dbZip') }
tasks.register('verifyArtifacts') {
    dependsOn tasks.named('bootWar'), tasks.named('dbZip')
    doLast {
        def warTree = zipTree(tasks.named('bootWar').get().archiveFile.get().asFile)
        if (!warTree.matching { include '**/*.sql' }.isEmpty()) {
            throw new GradleException('SQL belongs only in the separate database ZIP.')
        }
        if (warTree.matching { include 'WEB-INF/classes/application.yml' }.isEmpty()) {
            throw new GradleException('WAR is missing application.yml.')
        }
        if (warTree.matching { include 'WEB-INF/lib/spring-boot-web-server-*.jar' }.isEmpty()
            || !warTree.matching { include 'WEB-INF/lib/tomcat-embed-*.jar' }.isEmpty()) {
            throw new GradleException('Incorrect external/embedded Tomcat dependency layout.')
        }
        new java.util.zip.ZipFile(tasks.named('dbZip').get().archiveFile.get().asFile).withCloseable { zip ->
            def actual = zip.entries().toList().findAll { !it.directory }.collect { it.name }.sort()
            def dbPath = file('db').toPath()
            def expected = fileTree('db') { include '**/*.sql' }.files.collect {
                dbPath.relativize(it.toPath()).toString().replace(File.separator, '/')
            }.sort()
            if (actual.isEmpty() || actual != expected || actual.any { !it.contains('/') || !it.endsWith('.sql') }) {
                throw new GradleException('Database ZIP does not preserve the schema SQL files.')
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyArtifacts') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('wrapper') {
    gradleVersion = '9.3.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '0d585f69da091fc5b2beced877feab55a3064d43b8a1d46aeb07996b0915e0e0'
}
