plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.oxygenraj'
version = '0.0.1-SNAPSHOT'
description = 'Hi/Hello REST service using INITIAL_DB and Eureka discovery'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories { mavenCentral() }

dependencyManagement {
    imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.3' }
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc17'
    // Eureka needs ServerProperties even when an external Tomcat supplies the server.
    implementation 'org.springframework.boot:spring-boot-web-server'
    providedRuntime('org.springframework.boot:spring-boot-starter-tomcat-runtime') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-web-server'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '512m'
}

tasks.named('bootWar') { archiveFileName = 'initial-service.war' }
tasks.named('war') { enabled = false }
tasks.register('verifyWarLayout') {
    dependsOn tasks.named('bootWar')
    doLast {
        def packaged = zipTree(tasks.named('bootWar').get().archiveFile.get().asFile)
        if (packaged.matching { include 'WEB-INF/lib/spring-boot-web-server-*.jar' }.isEmpty()) {
            throw new GradleException('Eureka requires spring-boot-web-server in WEB-INF/lib for external Tomcat.')
        }
        if (!packaged.matching { include 'WEB-INF/lib/tomcat-embed-*.jar' }.isEmpty()) {
            throw new GradleException('Embedded Tomcat jars must be in WEB-INF/lib-provided, not WEB-INF/lib.')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyWarLayout') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('wrapper') {
    gradleVersion = '9.3.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '0d585f69da091fc5b2beced877feab55a3064d43b8a1d46aeb07996b0915e0e0'
}
