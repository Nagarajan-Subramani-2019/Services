<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Spring AI Chat</title>
    <style>
        :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172033; }
        main { width: min(760px, calc(100% - 32px)); height: min(760px, calc(100vh - 32px)); display: grid; grid-template-rows: auto 1fr auto; background: #fff; border: 1px solid #dce3ef; border-radius: 18px; box-shadow: 0 18px 50px #20345b1f; overflow: hidden; }
        header { padding: 22px 24px; border-bottom: 1px solid #e5eaf2; }
        h1 { margin: 0; font-size: 1.25rem; }
        header p { margin: 6px 0 0; color: #5a667a; font-size: .9rem; }
        #messages { padding: 20px 24px; overflow-y: auto; display: grid; align-content: start; gap: 14px; }
        .message { max-width: 85%; padding: 12px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.45; }
        .message strong { display: block; margin-bottom: 4px; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
        .user { justify-self: end; background: #2457d6; color: white; border-bottom-right-radius: 3px; }
        .assistant { background: #edf1f7; color: #172033; border-bottom-left-radius: 3px; }
        .error { background: #fff0f0; color: #9b1c1c; border: 1px solid #ffcaca; }
        form { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 16px 24px 22px; border-top: 1px solid #e5eaf2; }
        textarea { min-height: 48px; max-height: 160px; resize: vertical; padding: 12px; border: 1px solid #b9c5d8; border-radius: 10px; font: inherit; color: inherit; background: transparent; }
        button { align-self: end; padding: 12px 18px; border: 0; border-radius: 10px; background: #2457d6; color: white; font: inherit; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #cancel { background: #68758a; }
        #status { grid-column: 1 / -1; min-height: 1.2em; margin: -2px 0 0; color: #5a667a; font-size: .85rem; }
        @media (prefers-color-scheme: dark) { body { background: #111827; color: #edf2ff; } main { background: #1b2535; border-color: #37455d; } header, form { border-color: #37455d; } header p { color: #b9c5d8; } .assistant { background: #29384e; color: #edf2ff; } textarea { border-color: #61708a; } }
    </style>
</head>
<body>
<main>
    <header>
        <h1>Local Spring AI Chat</h1>
        <p>Responses are generated by Ollama on this computer.</p>
    </header>
    <section id="messages" aria-live="polite">
        <article class="message assistant"><strong>Assistant</strong>Hi! Ask me anything.</article>
    </section>
    <form id="chat-form">
        <label for="message" hidden>Message</label>
        <textarea id="message" maxlength="4000" placeholder="Type a message…" required></textarea>
        <button id="cancel" type="button" hidden disabled>Cancel</button>
        <button id="send" type="submit">Send</button>
        <p id="status" role="status" aria-live="polite" hidden></p>
    </form>
</main>
<script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const sendButton = document.getElementById('send');
    const cancelButton = document.getElementById('cancel');
    const status = document.getElementById('status');
    const messages = document.getElementById('messages');
    let activeController = null;
    let statusTimer = null;
    let startedAt = 0;

    function addMessage(kind, label, text) {
        const article = document.createElement('article');
        const heading = document.createElement('strong');
        const content = document.createElement('span');
        article.className = `message ${kind}`;
        heading.textContent = label;
        content.textContent = text;
        article.append(heading, content);
        messages.append(article);
        messages.scrollTop = messages.scrollHeight;
        return { article, heading, content };
    }

    function scrollMessagesToBottom() {
        messages.scrollTop = messages.scrollHeight;
    }

    function setStatus(text) {
        status.textContent = text;
        status.hidden = !text;
    }

    function stopStatusTimer() {
        if (statusTimer !== null) {
            window.clearInterval(statusTimer);
            statusTimer = null;
        }
        setStatus('');
    }

    function startStatusTimer() {
        startedAt = Date.now();
        const update = () => {
            const elapsedSeconds = Math.floor((Date.now() - startedAt) / 1000);
            const minutes = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
            const seconds = (elapsedSeconds % 60).toString().padStart(2, '0');
            setStatus(`Generating… ${minutes}:${seconds} — you can wait or Cancel.`);
        };
        update();
        statusTimer = window.setInterval(update, 1000);
    }

    function setPending(pending) {
        input.disabled = pending;
        sendButton.disabled = pending;
        sendButton.textContent = pending ? 'Generating…' : 'Send';
        cancelButton.hidden = !pending;
        cancelButton.disabled = !pending;
    }

    function showResponseError(responseMessage, errorMessage) {
        responseMessage.article.className = 'message error';
        responseMessage.heading.textContent = 'Error';
        responseMessage.content.textContent = errorMessage;
        scrollMessagesToBottom();
    }

    function showCancelled(responseMessage) {
        responseMessage.heading.textContent = 'Assistant — cancelled';
        responseMessage.content.textContent = 'Generation cancelled.';
        scrollMessagesToBottom();
    }

    function parseSseEvent(block) {
        let event = 'message';
        const data = [];

        for (const line of block.split('\n')) {
            if (line.startsWith('event:')) {
                event = line.slice(6).trim();
            } else if (line.startsWith('data:')) {
                data.push(line.slice(5).replace(/^ /, ''));
            }
        }

        return { event, data: data.join('\n') };
    }

    async function readEventStream(response, handleEvent) {
        if (!response.body) {
            throw new Error('The chat service did not start a response stream.');
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { value, done } = await reader.read();
            if (value) {
                buffer += decoder.decode(value, { stream: !done });
                buffer = buffer.replace(/\r\n/g, '\n');
            }

            let boundary = buffer.indexOf('\n\n');
            while (boundary !== -1) {
                const block = buffer.slice(0, boundary);
                buffer = buffer.slice(boundary + 2);
                if (block) {
                    handleEvent(parseSseEvent(block));
                }
                boundary = buffer.indexOf('\n\n');
            }

            if (done) {
                buffer += decoder.decode();
                if (buffer.trim()) {
                    handleEvent(parseSseEvent(buffer));
                }
                return;
            }
        }
    }

    if (window.location.protocol === 'file:') {
        addMessage(
            'error',
            'Open through Spring Boot',
            'This page must be opened at http://localhost:8080 after running ./gradlew bootRun. A file:// page cannot call the local chat API.'
        );
        input.disabled = true;
        sendButton.disabled = true;
    }

    cancelButton.addEventListener('click', () => {
        activeController?.abort();
    });

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (window.location.protocol === 'file:') return;
        const message = input.value.trim();
        if (!message || sendButton.disabled) return;

        addMessage('user', 'You', message);
        input.value = '';
        const responseMessage = addMessage('assistant', 'Assistant', 'Generating…');
        const controller = new AbortController();
        activeController = controller;
        let answer = '';
        let receivedDone = false;
        let streamError = '';
        setPending(true);
        startStatusTimer();

        try {
            const response = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'text/event-stream'
                },
                body: JSON.stringify({ message }),
                signal: controller.signal
            });

            if (!response.ok) {
                const body = await response.json().catch(() => ({}));
                throw new Error(body.error || 'The chat service returned an error.');
            }

            await readEventStream(response, ({ event: eventName, data }) => {
                if (eventName === 'token') {
                    answer += data;
                } else if (eventName === 'error') {
                    streamError = data || 'The chat service returned an error.';
                } else if (eventName === 'done') {
                    receivedDone = true;
                }
            });

            if (controller.signal.aborted) {
                showCancelled(responseMessage);
            } else if (streamError) {
                showResponseError(responseMessage, streamError);
            } else if (!receivedDone) {
                showResponseError(responseMessage, 'The response stream ended before completion. Please try again.');
            } else if (!answer.trim()) {
                showResponseError(responseMessage, 'The local model did not return a final answer. Please try again.');
            } else {
                responseMessage.content.textContent = answer;
                scrollMessagesToBottom();
            }
        } catch (error) {
            if (controller.signal.aborted || error.name === 'AbortError') {
                showCancelled(responseMessage);
            } else {
                showResponseError(responseMessage, error.message || 'The chat service returned an error.');
            }
        } finally {
            if (activeController === controller) {
                activeController = null;
                stopStatusTimer();
                setPending(false);
                input.focus();
            }
        }
    });
</script>
</body>
</html>
