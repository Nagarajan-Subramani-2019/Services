spring.application.name=demo
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://127.0.0.1:11434
spring.ai.ollama.chat.model=qwen3:4b
spring.ai.ollama.chat.temperature=0.2
# This Qwen3 template always starts with <think>. Enable Ollama's separation so
# reasoning stays in metadata; ChatClient.content() exposes only the final answer.
spring.ai.ollama.chat.think=true
spring.ai.ollama.chat.num-predict=2048
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.retry.max-attempts=1
spring.ai.retry.backoff.initial-interval=250ms
spring.ai.retry.backoff.multiplier=1
spring.ai.retry.backoff.max-interval=250ms
# Keep a local streaming response open until Ollama finishes or the user cancels it.
spring.mvc.async.request-timeout=0
