plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.oxygenraj'
version = '0.0.1-SNAPSHOT'
description = 'Node-built user interface served by a Java WAR with Eureka and userInfoServices integration'

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral() }
dependencyManagement {
    imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.3' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-web-server'
    providedRuntime('org.springframework.boot:spring-boot-starter-tomcat-runtime') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-web-server'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Node is a BUILD tool; the completed WAR needs only Java at runtime.
// Override NODE_BINARY when Node is not on PATH. No global npm install is used.
def nodeBinary = providers.environmentVariable('NODE_BINARY').orElse('node')
tasks.register('frontendBuild', Exec) {
    group = 'build'
    description = 'Build the static UI with Node.js.'
    workingDir layout.projectDirectory.dir('frontend')
    commandLine nodeBinary.get(), 'scripts/build.mjs'
    inputs.dir('frontend/src')
    inputs.file('frontend/scripts/build.mjs')
    inputs.file('frontend/package.json')
    outputs.dir('frontend/dist')
}

tasks.register('frontendTest', Exec) {
    group = 'verification'
    description = 'Run dependency-free Node.js frontend tests.'
    workingDir layout.projectDirectory.dir('frontend')
    commandLine nodeBinary.get(), '--test'
    inputs.dir('frontend/src')
    inputs.dir('frontend/test')
}

tasks.register('syncFrontend', Sync) {
    dependsOn tasks.named('frontendBuild')
    from layout.projectDirectory.dir('frontend/dist')
    into layout.buildDirectory.dir('generated-resources/frontend/static')
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated-resources/frontend'))
tasks.named('processResources') { dependsOn tasks.named('syncFrontend') }
tasks.named('test') { useJUnitPlatform(); maxHeapSize = '512m' }
tasks.named('bootWar') { archiveFileName = 'user-info-ui.war' }
tasks.named('war') { enabled = false }
tasks.matching { it.name in ['jar', 'bootJar'] }.configureEach { enabled = false }

tasks.register('verifyArtifacts') {
    group = 'verification'
    dependsOn tasks.named('bootWar')
    doLast {
        def contents = zipTree(tasks.named('bootWar').get().archiveFile.get().asFile)
        if (contents.matching { include 'WEB-INF/classes/static/index.html' }.isEmpty()
                || contents.matching { include 'WEB-INF/classes/static/**/*.js' }.isEmpty()
                || contents.matching { include 'WEB-INF/classes/static/**/*.css' }.isEmpty()) {
            throw new GradleException('WAR is missing the Node-built UI assets.')
        }
        if (!contents.matching { include '**/*.sql', '**/node_modules/**' }.isEmpty()) {
            throw new GradleException('The UI WAR must not contain SQL or node_modules.')
        }
        if (contents.matching { include 'WEB-INF/lib/spring-boot-web-server-*.jar' }.isEmpty()
                || contents.matching { include 'WEB-INF/lib-provided/tomcat-embed-core-*.jar' }.isEmpty()
                || !contents.matching { include 'WEB-INF/lib/tomcat-embed-*.jar' }.isEmpty()) {
            throw new GradleException('Incorrect executable/external Tomcat WAR layout.')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('frontendTest'), tasks.named('verifyArtifacts') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('wrapper') {
    gradleVersion = '9.3.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '0d585f69da091fc5b2beced877feab55a3064d43b8a1d46aeb07996b0915e0e0'
}
