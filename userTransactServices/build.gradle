plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.oxygenraj'
version = '0.0.1-SNAPSHOT'
description = 'Transaction APIs owned by USER_TRANSACT_SCHEMA, with database-configured Eureka discovery'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral() }
dependencyManagement {
    imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.3' }
}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-web-server'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc17'
    providedRuntime('org.springframework.boot:spring-boot-starter-tomcat-runtime') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-web-server'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform(); maxHeapSize = '512m' }
tasks.named('bootWar') { archiveFileName = 'userTransactServices.war' }
tasks.named('war') { enabled = false }
tasks.matching { it.name in ['jar', 'bootJar'] }.configureEach { enabled = false }

tasks.register('dbZip', Zip) {
    group = 'distribution'
    description = 'Package SQL by schema; never execute SQL or create schemas.'
    archiveFileName = 'userTransactServices-db.zip'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(layout.projectDirectory.dir('db')) { include '**/*.sql' }
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.FAIL
    doFirst {
        if (!fileTree('db') { include '*.sql' }.isEmpty()) {
            throw new GradleException('Place SQL under db/SCHEMA_NAME/, not directly in db/.')
        }
    }
}
tasks.register('zipDbFolder') { dependsOn tasks.named('dbZip') }
tasks.named('bootWar') { dependsOn tasks.named('dbZip') }
tasks.named('assemble') { dependsOn tasks.named('dbZip') }
tasks.register('verifyArtifacts') {
    group = 'verification'
    dependsOn tasks.named('bootWar'), tasks.named('dbZip')
    doLast {
        def contents = zipTree(tasks.named('bootWar').get().archiveFile.get().asFile)
        if (!contents.matching { include '**/*.sql' }.isEmpty()) {
            throw new GradleException('SQL must remain outside the WAR.')
        }
        if (contents.matching { include 'WEB-INF/classes/application.yml' }.isEmpty()
                || contents.matching { include 'WEB-INF/classes/META-INF/spring.factories' }.isEmpty()
                || contents.matching { include 'WEB-INF/lib/ojdbc17-*.jar' }.isEmpty()) {
            throw new GradleException('WAR is missing configuration, bootstrap registration or Oracle driver.')
        }
        if (contents.matching { include 'WEB-INF/lib/spring-boot-web-server-*.jar' }.isEmpty()
                || contents.matching { include 'WEB-INF/lib-provided/tomcat-embed-core-*.jar' }.isEmpty()
                || !contents.matching { include 'WEB-INF/lib/tomcat-embed-*.jar' }.isEmpty()) {
            throw new GradleException('Incorrect executable/external Tomcat dependency layout.')
        }
        new java.util.zip.ZipFile(tasks.named('dbZip').get().archiveFile.get().asFile).withCloseable { zip ->
            def actual = zip.entries().toList().findAll { !it.directory }.collect { it.name }.sort()
            def expected = fileTree('db') { include '**/*.sql' }.files.collect {
                file('db').toPath().relativize(it.toPath()).toString().replace(File.separator, '/')
            }.sort()
            if (actual.isEmpty() || actual != expected || actual.any { !it.contains('/') || !it.endsWith('.sql') }) {
                throw new GradleException('Database ZIP must contain exactly the schema-organized SQL files.')
            }
            actual.each { name ->
                def sql = zip.getInputStream(zip.getEntry(name)).getText('UTF-8')
                if (sql =~ /(?im)^\s*(CREATE\s+(USER|SCHEMA)|GRANT\s|DROP\s|TRUNCATE\s)/) {
                    throw new GradleException('SQL ZIP must not create schemas/users, grant access or delete data.')
                }
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyArtifacts') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('wrapper') {
    gradleVersion = '9.3.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '0d585f69da091fc5b2beced877feab55a3064d43b8a1d46aeb07996b0915e0e0'
}
